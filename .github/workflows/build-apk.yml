name: Build Owl Launcher APK

on:
  push:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "Error: Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          mkdir -p "$SDK_DIR/licenses"
          cat <<'EOF' > "$SDK_DIR/licenses/android-sdk-license"
          24333f8a63b6825ea9c5514f83c2829b004d1fee
          8933bad161af4178b1185d1a37fbf41ea5269c55
          d56f5187479451eabf01fb78af6dfcb131a6481e
          EOF
          cat <<'EOF' > "$SDK_DIR/licenses/android-sdk-preview-license"
          84831b9409646a918e30573bab4c9c91346d8abd
          EOF

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager \
            "$SDK_DIR/tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || true
          else
            echo "sdkmanager not found; using pre-installed Android SDK and accepted licenses in $SDK_DIR"
          fi

      - name: Prepare environment config and debug keystore
        run: |
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Build Owl Launcher APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          APK_FILE="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated"
            exit 1
          fi
          cp "$APK_FILE" release-apk/OwlLauncher.apk
          ls -lh release-apk/OwlLauncher.apk

      - name: Upload OwlLauncher.apk Artifact
        uses: actions/upload-artifact@v7
        with:
          name: OwlLauncher-APK
          path: release-apk/OwlLauncher.apk
          retention-days: 30

      - name: Publish GitHub Release (on manual run or tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          name: Owl Launcher APK (Build #${{ github.run_number }})
          files: release-apk/OwlLauncher.apk
          generate_release_notes: true
