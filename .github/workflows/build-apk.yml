name: Build Owl Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          - name: Set up Android SDK
  uses: android-actions/setup-android@v3
  with:
    packages: ""
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36.1'

      - name: Accept Android SDK licenses and install SDK 36
        run: |
          set +o pipefail
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" "platforms;android-36" || true
          fi

      - name: Prepare environment config and debug keystore
        run: |
          if [ ! -f .env.example ]; then
            touch .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Owl Launcher APK
        run: gradle assembleDebug --no-daemon --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Prepare APK artifact
        run: |
          mkdir -p release-apk
          APK_FILE="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated"
            exit 1
          fi
          cp "$APK_FILE" release-apk/OwlLauncher.apk
          ls -lh release-apk/OwlLauncher.apk

      - name: Upload OwlLauncher.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwlLauncher-APK
          path: release-apk/OwlLauncher.apk
          retention-days: 30

      - name: Publish GitHub Release (on manual run or tag)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('apk-build-{0}', github.run_number) }}
          name: Owl Launcher APK (Build #${{ github.run_number }})
          files: release-apk/OwlLauncher.apk
          generate_release_notes: true
